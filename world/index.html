<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvage Road world</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2f4a; }
      canvas#view { display: block; }
      .panel {
        position: fixed; color: #eee; font: 13px/1.5 system-ui, sans-serif;
        background: rgba(16, 20, 22, 0.74); padding: 8px 12px; border-radius: 4px; pointer-events: none;
        white-space: pre;
      }
      #info { top: 8px; left: 8px; font-family: monospace; }
      #where { top: 8px; right: 8px; font-family: monospace; text-align: right; }
      #help { bottom: 8px; left: 8px; }
      #loading { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; }
      #map {
        position: fixed; right: 8px; bottom: 8px; width: 240px; height: 240px;
        border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 4px; background: #0b2f4a; cursor: crosshair;
      }
      #map.big { width: min(92vh, 92vw); height: min(92vh, 92vw); right: 50%; bottom: 50%; transform: translate(50%, 50%); z-index: 5; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="info" class="panel"></div>
    <div id="where" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="loading" class="panel">Making the world...</div>
    <canvas id="map"></canvas>
    <script type="module" src="/src/world/main.ts"></script>
  </body>
</html>
