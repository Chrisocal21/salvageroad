<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvage Road base builder</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }
      .panel {
        position: fixed; color: #eee; font: 13px/1.5 system-ui, sans-serif;
        background: rgba(20, 22, 20, 0.72); padding: 8px 12px; border-radius: 4px; pointer-events: none;
        white-space: pre;
      }
      #stats { top: 8px; left: 8px; font-family: monospace; }
      #help { top: 64px; left: 8px; }
      #status { top: 8px; left: 50%; transform: translateX(-50%); font-size: 15px; min-width: 220px; text-align: center; }
      #status.bad { color: #ff9b8e; }
      #status.good { color: #9bf0ae; }
      #level { top: 8px; right: 8px; text-align: right; }
      #level b { font-size: 22px; }
      #menu {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 14px; background: rgba(20, 22, 20, 0.82); padding: 8px 12px; border-radius: 6px;
        font: 13px system-ui, sans-serif; color: #eee; user-select: none;
      }
      #menu .group { display: flex; flex-direction: column; gap: 4px; }
      #menu .title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa; }
      #menu .row { display: flex; gap: 4px; }
      #menu button {
        font: inherit; color: inherit; background: #2c302b; border: 1px solid #4a5048; border-radius: 4px;
        padding: 6px 10px; cursor: pointer;
      }
      #menu button:hover { background: #3a3f38; }
      #menu button.on { background: #e0a43a; border-color: #ffd27a; color: #1a1408; }
      #menu kbd { opacity: 0.7; margin-right: 6px; font: 11px monospace; }
    </style>
  </head>
  <body>
    <div id="stats" class="panel"></div>
    <div id="status" class="panel"></div>
    <div id="level" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="menu"></div>
    <script type="module" src="/src/base/main.ts"></script>
  </body>
</html>
